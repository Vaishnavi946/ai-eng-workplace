services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend-node

  backend-node:
    build: ./backend-node
    ports:
      - "5000:5000"
    env_file:
      - ./backend-node/.env
    environment:
      - AI_SERVICE_URL=http://ai-service-python:8000
    depends_on:
      - ai-service-python

  ai-service-python:
    build: ./ai-service-python
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service-python/.env
    volumes:
      - chroma-data:/app/app/data

volumes:
  chroma-data:
